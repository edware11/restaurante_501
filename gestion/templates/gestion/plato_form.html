{% extends 'gestion/base.html' %}

{% block title %}{% if objeto %}Editar{% else %}Nuevo{% endif %} Plato — Pasta La Vista{% endblock %}

{% block content %}
<h2 class="page-title">{% if objeto %}✏️ Editar Plato{% else %}➕ Nuevo Plato{% endif %}</h2>

<div class="form-container">
  <form method="post">
    {% csrf_token %}
    <div class="form-group">
      <label>Nombre del plato</label>
      <input type="text" name="nombre" value="{{ objeto.nombre|default:'' }}" required placeholder="Ej: Pasta Carbonara">
    </div>
    <div class="form-group">
      <label>Categoría</label>
      <input type="text" name="categoria" value="{{ objeto.categoria|default:'' }}" placeholder="Ej: Pastas, Entradas, Bebidas">
    </div>
    <div class="form-group">
      <label>Precio ($)</label>
      <input type="number" name="precio" value="{{ objeto.precio|default:'' }}" required min="0" step="0.01" placeholder="0.00">
    </div>
    <div class="form-group">
      <label>Descripción</label>
      <textarea name="descripcion" rows="3" placeholder="Descripción del plato...">{{ objeto.descripcion|default:'' }}</textarea>
    </div>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">
        {% if objeto %}💾 Guardar cambios{% else %}✅ Crear plato{% endif %}
      </button>
      <a href="{% url 'platos' %}" class="btn btn-secondary">← Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
