{% extends 'gestion/base.html' %}

{% block title %}{% if objeto %}Editar{% else %}Nueva{% endif %} Mesa — Pasta La Vista{% endblock %}

{% block content %}
<h2 class="page-title">{% if objeto %}✏️ Editar Mesa{% else %}➕ Nueva Mesa{% endif %}</h2>

<div class="form-container">
  <form method="post">
    {% csrf_token %}
    <div class="form-group">
      <label>Número de mesa</label>
      <input type="number" name="numero_mesa" value="{{ objeto.numero_mesa|default:'' }}" required min="1">
    </div>
    <div class="form-group">
      <label>Capacidad (personas)</label>
      <input type="number" name="capacidad" value="{{ objeto.capacidad|default:'4' }}" required min="1" max="20">
    </div>
    <div class="form-group">
      <label>Estado</label>
      <select name="estado">
        <option value="disponible" {% if objeto.estado == 'disponible' %}selected{% endif %}>Disponible</option>
        <option value="ocupada"    {% if objeto.estado == 'ocupada'    %}selected{% endif %}>Ocupada</option>
        <option value="reservada"  {% if objeto.estado == 'reservada'  %}selected{% endif %}>Reservada</option>
      </select>
    </div>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">
        {% if objeto %}💾 Guardar cambios{% else %}✅ Crear mesa{% endif %}
      </button>
      <a href="{% url 'mesas' %}" class="btn btn-secondary">← Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
