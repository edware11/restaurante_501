{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro — Pasta La Vista</title>
  <link rel="stylesheet" href="{% static 'gestion/css/styles.css' %}">
  <link rel="stylesheet" href="{% static 'gestion/css/auth.css' %}">
</head>
<body>
<div class="auth-page">
  <div class="auth-card">

    <div class="auth-logo">
      <span class="logo-icon">🍝</span>
      <h2>Crear Cuenta</h2>
      <p>Registro de administrador</p>
    </div>

    {% if messages %}
      {% for message in messages %}
        <div class="alert alert-{{ message.tags }}">{{ message }}</div>
      {% endfor %}
    {% endif %}

    <form method="post">
      {% csrf_token %}

      <div class="form-group">
        <label for="username">Usuario</label>
        <input type="text" id="username" name="username" placeholder="Nombre de usuario" required>
      </div>

      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" name="email" placeholder="correo@ejemplo.com">
      </div>

      <div class="form-group">
        <label for="password1">Contraseña</label>
        <input type="password" id="password1" name="password1" placeholder="••••••••" required>
      </div>

      <div class="form-group">
        <label for="password2">Confirmar contraseña</label>
        <input type="password" id="password2" name="password2" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn btn-primary btn-full">✅ Registrarse</button>
    </form>

    <div class="auth-footer-link">
      <p>¿Ya tienes cuenta? <a href="{% url 'login' %}">Inicia sesión</a></p>
    </div>

  </div>
</div>
</body>
</html>
