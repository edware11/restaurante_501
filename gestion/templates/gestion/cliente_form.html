{% extends 'gestion/base.html' %}

{% block title %}{% if objeto %}Editar{% else %}Nuevo{% endif %} Cliente — Pasta La Vista{% endblock %}

{% block content %}
<h2 class="page-title">{% if objeto %}✏️ Editar Cliente{% else %}➕ Nuevo Cliente{% endif %}</h2>

<div class="form-container">
  <form method="post">
    {% csrf_token %}

    <div class="form-group">
      <label for="nombre">Nombre</label>
      <input type="text" id="nombre" name="nombre"
             value="{{ objeto.nombre|default:'' }}" placeholder="Nombre del cliente" required>
    </div>

    <div class="form-group">
      <label for="telefono">Teléfono</label>
      <input type="tel" id="telefono" name="telefono"
             value="{{ objeto.telefono|default:'' }}" placeholder="Ej: 3001234567"
             pattern="[0-9]+" inputmode="numeric"
             oninput="this.value=this.value.replace(/[^0-9]/g,'')">
    </div>

    <div class="form-group">
      <label for="correo">Correo electrónico</label>
      <input type="email" id="correo" name="correo"
             value="{{ objeto.correo|default:'' }}" placeholder="correo@ejemplo.com">
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary">
        {% if objeto %}💾 Guardar cambios{% else %}✅ Crear cliente{% endif %}
      </button>
      <a href="{% url 'clientes' %}" class="btn btn-secondary">← Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
